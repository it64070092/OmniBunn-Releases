name: Verify recovery signing prerequisites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    environment: release-signing
    steps:
      - name: Verify recovery public key and private build read access
        env:
          SIGNING_KEY: ${{ secrets.OMNIBUNN_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.OMNIBUNN_BUILD_READ_TOKEN }}
        run: |
          set -eu
          fingerprint=$(printf '%s' "$SIGNING_KEY" | openssl pkey -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)
          test "$fingerprint" = e746fbf591cdaee198a49abef3353dad0d311c5596a466ad74b1ac41322121f0
          echo 'Recovery signing key matches pinned public key'
          gh api repos/it64070092/DB_Ochestration/commits/6cdef42ccf097997db7d377c7114cfeb98d0892c --silent
          gh api repos/it64070092/DB_Ochestration/actions/runs/41338452199 --jq 'if .conclusion == "success" then "Private build read access verified" else error("Expected successful reference build") end'