name: Validate signing secret configuration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    environment: release-signing
    steps:
      - name: Check key identity without exposing secret
        env:
          SIGNING_KEY: ${{ secrets.OMNIBUNN_RELEASE_SIGNING_KEY }}
          BUILD_TOKEN: ${{ secrets.OMNIBUNN_BUILD_READ_TOKEN }}
        run: |
          node <<'JS'
          const crypto = require('node:crypto');
          let matches = false;
          try {
            const key = crypto.createPrivateKey(process.env.SIGNING_KEY || '');
            const pub = crypto.createPublicKey(key).export({ type: 'spki', format: 'der' });
            matches = key.asymmetricKeyType === 'ed25519' && crypto.createHash('sha256').update(pub).digest('hex') === 'd931742d9af84161877a43429d95cfecbba429f2dc9a5937ae3f3b3dc1426ccd';
          } catch {}
          console.log(JSON.stringify({ signingKeyMatchesPublishedTrust: matches, buildReadTokenPresent: Boolean(process.env.BUILD_TOKEN) }));
          if (!matches) process.exitCode = 1;
          JS